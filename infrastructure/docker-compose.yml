version: '3.9'

services:
  api:
    build: ../backend
    environment:
      AEGIS_POSTGRES_DSN: postgresql+psycopg://aegis:aegis@db:5432/aegisscan
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ../storage:/data/storage

  worker:
    build: ../backend
    command: celery -A app.workers.celery_app.celery_app worker -Q static,url,dynamic --loglevel=info
    environment:
      AEGIS_POSTGRES_DSN: postgresql+psycopg://aegis:aegis@db:5432/aegisscan
      AEGIS_REDIS_URL: redis://redis:6379/0
      AEGIS_STORAGE_DIR: /data/storage
    depends_on:
      - db
      - redis
    volumes:
      - ../storage:/data/storage

  redis:
    image: redis:7-alpine

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisscan
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
